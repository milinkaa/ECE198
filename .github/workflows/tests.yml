# Runs the Flask test suite on every push and pull request to render-demo.
# Validate Python and Arduino firmware before merging into the deployment branch.
name: Tests

on:
  push:
    branches: [render-demo]
  pull_request:
    branches: [render-demo]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Web & Database"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Web & Database/requirements*.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  arduino-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install UNO R4 Minima core and OLED libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

      - name: Compile V3 prescription-sync firmware
        run: arduino-cli compile --fqbn arduino:renesas_uno:minima firmware/v3/CCCARE_Arduino
